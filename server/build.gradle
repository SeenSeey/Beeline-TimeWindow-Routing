plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'stb'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	implementation 'org.apache.commons:commons-csv:1.14.1'
	implementation 'commons-io:commons-io:2.20.0'
    implementation 'ai.timefold.solver:timefold-solver-spring-boot-starter:2.6.0'

	implementation 'com.graphhopper:graphhopper-core:11.0'
	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'org.postgresql:postgresql'
	annotationProcessor 'org.projectlombok:lombok'
	annotationProcessor 'org.hibernate.orm:hibernate-processor'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
	useJUnitPlatform()
}

// Одноразовый генератор демо CSV, в приложение не входит
sourceSets {
	generator {
		compileClasspath += sourceSets.main.output
		runtimeClasspath += sourceSets.main.output
	}
}

configurations {
	generatorImplementation.extendsFrom implementation
	generatorRuntimeOnly.extendsFrom runtimeOnly
}

tasks.register('generateDataset', JavaExec) {
	group = 'dataset'
	description = 'Генерирует демо CSV в src/main/resources/demo/dataset из датасета организаторов src/generator/resources/Обезличивание'
	classpath = sourceSets.generator.runtimeClasspath
	mainClass = 'stb.core.infrastructure.csv.generator.DatasetGenerator'
	jvmArgs '-Dstdout.encoding=UTF-8', '-Dstderr.encoding=UTF-8'
	args = [
			file('src/generator/resources/Обезличивание').path,
			file('src/generator/resources/coordinates.csv').path,
			file('src/main/resources/demo/dataset').path
	]
}

spring:
  application.name: core

  datasource:
    url: jdbc:postgresql://localhost:5432/postgres
    username: postgres
    password: postgres
    driverClassName: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: true

app:
  geo:
    geocoder-api-key: api-key
    base-path: https://geocode-maps.yandex.ru/v1
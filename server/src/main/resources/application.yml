spring:
  application.name: core

  datasource:
    url: jdbc:postgresql://localhost:5432/postgres
    username: postgres
    password: postgres
    driverClassName: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: true

  data:
    redis:
      host: localhost
      port: 6379
      repositories:
        enabled: false

  task:
    execution:
      mode: force

app:
  route:
    osm-file: map/central-fed.osm.pbf
    graph-cache: map/graph-cache
    storage-ttl: 48h
  geo:
    geocoder-api-key: api-key
    base-path: https://geocode-maps.yandex.ru/v1
services:
  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "3000:3000"
    environment:
      - BACKEND_HOST=server:8080
      - FRONTEND_HOST=client:5173
    env_file: .env
    volumes:
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      server:
        condition: service_healthy
      client:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  postgres:
    image: postgres:16.4-alpine
    restart: always
    environment:
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: ${PG_DATABASE}
    ports:
      - "5433:5432"
    volumes:
      - ./environment/postgres:/var/lib/postgresql/data
    env_file:
      - ./.env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7.4-alpine
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - ./environment/redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  map-init:
    image: curlimages/curl
    user: root
    volumes:
      - ./maps:/maps
    command: ["sh", "-c", "[ -f /maps/central-fed.osm.pbf ] || (curl -fL -o /maps/central-fed.osm.pbf.tmp https://lctbln.firsts3.ru/central-fed.osm.pbf && mv /maps/central-fed.osm.pbf.tmp /maps/central-fed.osm.pbf)"]

  server:
    build: ./server
    restart: always
    environment:
      SPRING_DATASOURCE_URL: ${PG_CONNECTION_STRING}
      SPRING_DATASOURCE_USERNAME: ${PG_USER}
      SPRING_DATASOURCE_PASSWORD: ${PG_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SERVER_PORT: 8080
      APP_ROUTE_OSMFILE: map/central-fed.osm.pbf
      APP_ROUTE_GRAPHCACHE: map/graph-cache
      APP_GEO_GEOCODERAPIKEY: ${GEOCODER_API_KEY}
      TZ: "Europe/Moscow"
    ports:
      - "8080:8080"
    volumes:
      - ./maps:/app/map
      - ./environment/maps/graph-cache:/app/map/graph-cache
    env_file:
      - ./.env
    depends_on:
      map-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/8080' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 300s
      start_interval: 5s

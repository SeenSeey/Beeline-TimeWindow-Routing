services:
  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "3000:3000"
    environment:
      - BACKEND_HOST=server:8080
      - FRONTEND_HOST=client:5173
    env_file: .env
    networks:
      - root_network
    volumes:
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro

  postgres:
    image: postgres:16.4-alpine
    restart: always
    environment:
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: ${PG_DATABASE}
    ports:
      - "5433:5432"
    volumes:
      - ./environment/postgres:/var/lib/postgresql/data
    networks:
      - root_network
    env_file:
      - ./.env

  server:
    build: ./server
    restart: always
    environment:
      SPRING_DATASOURCE_URL: ${PG_CONNECTION_STRING}
      SPRING_DATASOURCE_USERNAME: ${PG_USER}
      SPRING_DATASOURCE_PASSWORD: ${PG_PASSWORD}
      SERVER_PORT: 8080
      APP_ROUTE_OSMFILE: map/central-fed.osm.pbf
      APP_ROUTE_GRAPHCACHE: map/graph-cache
      APP_GEO_GEOCODERAPIKEY: ${GEOCODER_API_KEY}
      TZ: "Europe/Moscow"
    ports:
      - "8080:8080"
    networks:
      - root_network
    volumes:
      - ./maps/central-fed.osm.pbf:/app/map/central-fed.osm.pbf
      - ./environment/maps/graph-cache:/app/map/graph-cache
    env_file:
      - ./.env

  client:
    build: ./client
    restart: always
    ports:
      - "5173:5173"
    volumes:
      - ./client:/app
      - /app/node_modules
    networks:
      - root_network

networks:
  root_network:
